[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
remappings = [
    "@openzeppelin/contracts/=lib/immutable/openzeppelin-contracts/contracts/",
    "yield-claim-nft/=lib/mutable/yield-claim-nft/src/",
    "pauser/=lib/mutable/pauser/src/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
